<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Panel redakcji</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>

<header>
  <h1>Panel redakcji</h1>
</header>

<nav>
  <a href="index.html">Strona główna</a>
  <a href="aktualnosci.html">Aktualności</a>
  <a href="wydarzenia.html">Wydarzenia</a>
  <a href="redakcja.html">Redakcja</a>
  <a href="kontakt.html">Kontakt</a>
</nav>

<main>
  <h2>Dodaj artykuł</h2>

  <form id="editor">
    <label>Tytuł</label>
    <input id="title" required>

    <label>Dział</label>
    <select id="category">
      <option>Aktualności</option>
      <option>Wydarzenia</option>
      <option>Sport</option>
      <option>Kultura</option>
      <option>Technologia</option>
    </select>

    <label>Data</label>
    <input type="date" id="date">

    <label>Treść</label>
    <textarea id="content" rows="5" required></textarea>

    <button type="submit">Dodaj</button>
  </form>
</main>

<script>
  document.getElementById("editor").addEventListener("submit", e => {
    e.preventDefault();

    saveArticle({
      title: title.value,
      category: category.value,
      date: date.value || new Date().toLocaleDateString("pl-PL"),
      content: content.value
    });

    alert("Artykuł dodany!");
    e.target.reset();
  });
</script>

</body>
</html>
